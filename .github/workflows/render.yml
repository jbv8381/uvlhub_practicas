name: Deploy to Render

on:
  push:
    tags:
      - "*"

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Verify merged and approved pull request
    runs-on: ubuntu-24.04
    steps:
      - name: Verify tag commit comes from an approved merged pull request
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const commitSha = context.sha;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: commitSha,
              state: 'closed',
            });

            for (const pullRequest of pullRequests) {
              if (!pullRequest.merged_at || pullRequest.base.ref !== 'main') {
                continue;
              }

              const { data: reviews } = await github.paginate(
                github.rest.pulls.listReviews,
                {
                  owner,
                  repo,
                  pull_number: pullRequest.number,
                  per_page: 100,
                },
              );

              const latestReviewByUser = new Map();
              for (const review of reviews) {
                latestReviewByUser.set(review.user.login, review.state);
              }

              if ([...latestReviewByUser.values()].includes('APPROVED')) {
                core.info(`Approved and merged pull request found: #${pullRequest.number}`);
                return;
              }
            }

            core.setFailed(
              `The tag ${context.ref} must point to the merge commit of an approved pull request into main.`,
            );

  tests:
    name: Run tests
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    services:
      mariadb:
        image: mariadb:12.0.2
        env:
          MARIADB_ROOT_PASSWORD: uvlhub_root_password
          MARIADB_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -u root -p$MARIADB_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ./rosemary

      - name: Run tests
        run: coverage run -m pytest app/features/ --ignore-glob='*selenium*'
        env:
          FLASK_ENV: testing
          MARIADB_HOSTNAME: 127.0.0.1
          MARIADB_PORT: 3306
          MARIADB_TEST_DATABASE: uvlhubdb_test
          MARIADB_USER: uvlhub_user
          MARIADB_PASSWORD: uvlhub_password

  deploy:
    name: Deploy to Render
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
